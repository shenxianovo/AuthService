name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'AuthService/**'
      - 'AuthService.Tests/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --no-restore --configuration Release

      - name: Publish
        run: dotnet publish AuthService/AuthService.csproj -c Release -o publish --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-backend-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: deploy/backend/

      - name: Copy Keys into publish artifact
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /srv/AuthService/releases/${{ github.run_id }}

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/backend/*"
          target: /srv/AuthService/releases/${{ github.run_id }}
          strip_components: 2

      - name: Switch & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Copy RSA keys into the new release
            cp /srv/keys/AuthService/* /srv/AuthService/releases/${{ github.run_id }}/Keys/

            # Atomic symlink switch
            ln -sfn /srv/AuthService/releases/${{ github.run_id }} /srv/AuthService/current

            # Restart via systemd (persistent, survives reboot)
            sudo systemctl restart authservice

            # Wait and verify
            sleep 3
            sudo systemctl is-active --quiet authservice && echo "✅ authservice is running" || (echo "❌ authservice failed to start" && sudo journalctl -u authservice -n 30 && exit 1)

            # Keep only the 5 most recent releases
            cd /srv/AuthService/releases && ls -dt */ | tail -n +6 | xargs rm -rf
