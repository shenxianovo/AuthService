name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with: 
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}"
            export GithubOAuth__ClientId="${{ secrets.GH_OAUTH_CLIENT_ID }}"
            export GithubOAuth__ClientSecret="${{ secrets.GH_OAUTH_CLIENT_SECRET }}"
            export GithubOAuth__CallbackUrl="${{ secrets.GH_OAUTH_CALLBACK_URL }}"
            export GoogleOAuth__ClientId="${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
            export GoogleOAuth__ClientSecret="${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
            export GoogleOAuth__CallbackUrl="${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}"
            bash /srv/AuthService/deploy/deploy.sh